---
layout: default
title: Izveidot profilu
---
      <!-- inner page section -->
      <section class="inner_page_head">
         <div class="container_fuild">
            <div class="row">
               <div class="col-md-12">
                  <div class="full">
                     <h3>Izveidot profilu</h3>
                  </div>
               </div>
            </div>
         </div>
      </section>
      <!-- end inner page section -->
      <section class="layout_padding">
         <div class="container">
            <div class="row justify-content-center">
               <div class="col-md-6">
                  <div class="alert alert-warning">
                     Šī ir mācību vietne. Neizmantojiet savu īsto paroli vai personas datus.
                  </div>
                  <form data-register-form data-redirect="index.html">
                     <div class="alert alert-danger" data-form-error hidden></div>
                     <div class="form-group">
                        <label for="name">Vārds</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                     </div>
                     <div class="form-group">
                        <label for="surname">Uzvārds</label>
                        <input type="text" class="form-control" id="surname" name="surname" required>
                     </div>
                     <div class="form-group">
                        <label for="email">E-pasts</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                     </div>
                     <div class="form-group">
                        <label for="password">Parole</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                     </div>
                     <div class="form-group">
                        <label for="address">Adrese</label>
                        <input type="text" class="form-control" id="address" name="address">
                     </div>
                     <div class="form-group">
                        <label for="phone_number">Telefona numurs</label>
                        <input type="text" class="form-control" id="phone_number" name="phone_number">
                     </div>
                     <button type="submit" class="btn">Reģistrēties</button>
                  </form>
                  <p style="margin-top: 20px;">
                     Jau ir profils? <a href="login.html">Pieslēdzies</a>
                  </p>
               </div>
            </div>
         </div>
      </section>
